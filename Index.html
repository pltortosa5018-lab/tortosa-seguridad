<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05254E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Seguridad Tortosa">
<title>Seguridad Ciudadana Tortosa</title>
<style>
:root{--bg:#F5F7FA;--card:#fff;--ink:#0A2342;--navy:#05254E;--lime:#D4DD2B;--soft:#E6EAF1;--red:#E5392F;--ok:#2E9E5B;--mute:#5B6B84}
@media (prefers-color-scheme:dark){:root{--bg:#07121F;--card:#10213A;--ink:#E8EEFA;--navy:#1E4A8C;--soft:#1C3150;--mute:#93A5C4}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column}.scr.on{display:flex}
button,input,select{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.logo{aspect-ratio:1;border-radius:50%;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;container-type:inline-size;line-height:1;letter-spacing:-.02em}
.logo b{font-size:17cqw}.logo i{font-size:14cqw;color:var(--lime);font-style:normal;margin-top:3cqw;font-weight:400}
.logo div{display:flex;gap:3cqw;margin-top:7cqw}.logo span{width:7cqw;height:7cqw;background:#fff}
/* acceso */
#auth{overflow:auto}
.hero{background:var(--navy);color:#fff;padding:calc(34px + env(safe-area-inset-top)) 24px 36px;border-radius:0 0 34px 34px;text-align:center}
.hero .logo{width:104px;margin:0 auto 16px;background:#031a3a;box-shadow:0 0 0 6px rgba(255,255,255,.12)}
.hero h1{margin:0;font-size:26px;letter-spacing:-.02em}.hero p{margin:4px 0 0;opacity:.8}
.form{padding:24px 22px calc(24px + env(safe-area-inset-bottom))}
input,select{width:100%;padding:15px 16px;margin-bottom:10px;border:2px solid transparent;border-radius:14px;background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(5,37,78,.08)}
input:focus{border-color:var(--navy)}
.btn{width:100%;border:0;border-radius:16px;background:var(--navy);color:#fff;font-weight:700;font-size:17px;padding:16px;cursor:pointer;box-shadow:0 6px 16px rgba(5,37,78,.25)}
.btn.o{background:none;color:var(--ink);box-shadow:none;border:2px solid var(--navy);margin-top:10px}
#err{color:var(--red);min-height:22px;font-size:14px;margin:2px 0 6px}.note{font-size:12.5px;color:var(--mute);line-height:1.45}
/* inicio */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 18px 0}
.top .logo{width:84px}
.rb{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;font-size:19px;font-weight:700}
.rb svg{width:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
#lbl{text-align:center;font-weight:600;min-height:24px;margin:16px 20px 0;color:var(--mute)}#lbl.on{color:var(--ink)}
#orb{position:relative;width:min(96%,390px);aspect-ratio:1;margin:auto}
.ring{position:absolute;inset:10%;border:2.5px dotted var(--mute);border-radius:50%;opacity:.55}
#orb>.logo{position:absolute;width:40%;left:30%;top:30%;transition:transform .2s,box-shadow .2s;animation:p 2.8s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(30,74,140,.35)}70%{box-shadow:0 0 0 24px rgba(30,74,140,0)}100%{box-shadow:0 0 0 0 rgba(30,74,140,0)}}
#orb>.logo.hot{transform:scale(1.08);animation:none;box-shadow:0 0 0 9px rgba(212,221,43,.6)}
@media (prefers-reduced-motion:reduce){#orb>.logo{animation:none}}
.nd{position:absolute;width:19%;aspect-ratio:1;border-radius:50%;border:0;display:grid;place-items:center;touch-action:none;cursor:grab;transform:translate(-50%,-50%);transition:transform .25s;user-select:none;box-shadow:0 6px 14px rgba(5,37,78,.22)}
.nd svg{width:50%;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.bn{margin:0 16px calc(16px + env(safe-area-inset-bottom));border:0;border-radius:18px;background:var(--red);color:#fff;text-align:left;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;box-shadow:0 6px 16px rgba(229,57,47,.3)}
.bn.ok{background:var(--ok);box-shadow:0 6px 16px rgba(46,158,91,.3)}
.bn b{display:block;font-size:17px}.bn span{font-size:13px;opacity:.9}.bn svg{width:30px;flex:none;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* hojas */
#ov{position:absolute;inset:0;background:rgba(5,20,40,.55);display:none;align-items:flex-end}#ov.on{display:flex}
.sh{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:10px 22px calc(28px + env(safe-area-inset-bottom));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh:before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--soft);margin:0 auto 12px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);cursor:pointer;font-size:17px}
.sh h1{font-size:28px;margin:16px 0 8px;letter-spacing:-.02em}.sh p{line-height:1.5;margin:6px 0}
.li{display:flex;gap:14px;align-items:center;padding:10px 0}.li .c{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.li .c svg{width:26px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.li b{display:block}
.nt{border-left:5px solid #FFCD00;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(5,37,78,.08)}.nt span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.okc{width:76px;height:76px;border-radius:50%;background:var(--ok);display:grid;place-items:center;margin:14px auto 0}.okc svg{width:40px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.sh .ctr{text-align:center}

.hero{position:relative}
.pill{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;border:0;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;padding:8px 14px;font-weight:600;cursor:pointer}
.th{display:flex;align-items:center;gap:14px;width:100%;border:2px solid var(--soft);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font-weight:600;text-align:left}
.th[aria-pressed=true]{border-color:var(--navy)}.th span.sw{display:flex}.th u{width:26px;height:26px;border-radius:50%;margin-right:-8px;border:2px solid var(--card)}
/* Ebre */
html[data-t=ebre]{--bg:#EAF4F4;--ink:#0B2F33;--navy:#0B5D66;--lime:#F2A541;--soft:#D3E8E8;--mute:#4F7478;--card:#fff}
/* Noche */
html[data-t=noche]{--bg:#060B14;--card:#0F1A2B;--ink:#EAF2FF;--navy:#0F2A4D;--lime:#3DDCFF;--soft:#1A2B45;--mute:#7F95B5}
html[data-t=noche] .nd{box-shadow:0 0 18px rgba(61,220,255,.35)}html[data-t=noche] .btn{background:#1B5FB0;box-shadow:0 0 18px rgba(61,220,255,.25)}html[data-t=noche] .btn.o{background:none;color:var(--ink);border-color:var(--lime);box-shadow:none}
/* Alto contraste */
html[data-t=contraste]{--bg:#fff;--card:#fff;--ink:#000;--navy:#000;--lime:#FFE000;--soft:#D8D8D8;--mute:#222;--red:#C00000;--ok:#006B2D}
html[data-t=contraste] input,html[data-t=contraste] select{border-color:#000}html[data-t=contraste] .nd{border:3px solid #000}html[data-t=contraste] body{font-size:18px}
/* Minimal */
html[data-t=minimal]{--bg:#fff;--card:#fff;--ink:#111;--navy:#111;--lime:#FF6B5E;--soft:#EDEDED;--mute:#777}
html[data-t=minimal] .hero{background:none;color:#111}html[data-t=minimal] .pill{background:#EDEDED;color:#111}
html[data-t=minimal] .btn,html[data-t=minimal] .nd,html[data-t=minimal] .bn,html[data-t=minimal] input{box-shadow:none}
html[data-t=minimal] input{border-color:#DDD}html[data-t=minimal] .nd{background:#fff!important;border:1.5px solid #111}html[data-t=minimal] .ring{border-style:solid;opacity:.25}
</style>
</head>
<body>
<div id="app">
<section class="scr on" id="auth">
<div class="hero"><button class="pill" id="dsg">Diseño</button><div class="logo"><b>POLICIA</b><i>Tortosa</i><div><span></span><span></span><span></span><span></span></div></div><h1>Seguridad Ciudadana</h1><p>Policía Local de Tortosa</p></div>
<div class="form">
<input id="em" type="email" placeholder="Correo electrónico" autocomplete="email">
<input id="pw" type="password" placeholder="Contraseña (mín. 6)" autocomplete="current-password">
<input class="r" id="nm" placeholder="Nombre" hidden><input class="r" id="ap" placeholder="Apellidos" hidden>
<input class="r" id="te" type="tel" placeholder="Teléfono" hidden><input class="r" id="di" placeholder="Dirección de residencia" hidden>
<select class="r" id="gr" hidden><option>Ciudadanía</option><option>Establecimiento</option></select>
<div id="err"></div>
<button class="btn" id="go">Entrar</button><button class="btn o" id="tg">Crear una cuenta nueva</button>
<p class="note" style="margin-top:16px">Al registrarte aceptas el tratamiento de tus datos para gestionar avisos de seguridad. Texto legal pendiente del Ayuntamiento.</p>
</div>
</section>

<section class="scr" id="home">
<div class="top"><button class="rb" id="inf" aria-label="Secciones">i</button><div class="logo"><b>POLICIA</b><i>Tortosa</i></div><button class="rb" id="cfg" aria-label="Configuración"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
<div id="lbl">Arrastra una bola al círculo central</div>
<div id="orb"><div class="ring"></div><div class="logo" id="ctr"><b>POLICIA</b><i>Tortosa</i><div><span></span><span></span><span></span><span></span></div></div></div>
<button class="bn" id="bn"></button>
</section>
<div id="ov"><div class="sh"><button class="x" id="cl" aria-label="Cerrar">✕</button><div id="shb"></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://gaaaxoccsewsqghiutrq.supabase.co";
const SUPABASE_KEY = "sb_publishable_HkxGy62A8XhCUr04YoPeGA_RBQY2xaF";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = i => document.getElementById(i);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const show = n => document.querySelectorAll(".scr").forEach(s => s.classList.toggle("on", s.id == n));
const sheet = h => { $("shb").innerHTML = h; $("ov").classList.add("on"); };
$("cl").onclick = () => $("ov").classList.remove("on");
$("ov").onclick = e => { if (e.target == $("ov")) $("ov").classList.remove("on"); };
let me = null, perfil = null, reg = false;

const I = {
 mail:'<svg viewBox="0 0 24 24" stroke="#3A3000"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7.5l8.5 6 8.5-6"/></svg>',
 bag:'<svg viewBox="0 0 24 24" stroke="#5A1410"><path d="M5.5 8.5h13l-1 11.5h-11z"/><path d="M9 8.5a3 3 0 016 0"/></svg>',
 moon:'<svg viewBox="0 0 24 24" stroke="#fff"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>',
 rain:'<svg viewBox="0 0 24 24"><path d="M3.5 18a8.5 8.5 0 0117 0" stroke="#E5392F"/><path d="M6.5 18a5.5 5.5 0 0111 0" stroke="#F2B705"/><path d="M9.5 18a2.5 2.5 0 015 0" stroke="#2F6FDB"/></svg>',
 hand:'<svg viewBox="0 0 24 24" stroke="#6A1B8A"><path d="M7 12V6.5M10 11V4M13 11V4.5M16 12V7"/><path d="M7 12c0 5 2 8 5 8s5-3 5-6v-2"/></svg>'};
const nodes = [
 {id:"not",a:-50, bg:"#FFCD00",ic:I.mail,t:"Notificaciones",d:"Entérate de todas las novedades"},
 {id:"rob",a:50,  bg:"#FF9A90",ic:I.bag, t:"Robo",d:"Actívalo solo en caso de robo"},
 {id:"sen",a:-105,bg:"#05254E",ic:I.moon,t:"Aviso de sereno",d:"Pide la ayuda de un sereno"},
 {id:"lgb",a:105, bg:"#F8F1E9",ic:I.rain,t:"Violencia contra el colectivo LGTBI+",d:"Solo en caso de violencia contra el colectivo LGTBI+"},
 {id:"gen",a:180, bg:"#F2E6FA",ic:I.hand,t:"Violencia de género",d:"Solo en caso de violencia de género"}];

$("tg").onclick = () => { reg = !reg; document.querySelectorAll(".r").forEach(e => e.hidden = !reg);
  $("go").textContent = reg ? "Crear cuenta" : "Entrar"; $("tg").textContent = reg ? "Ya tengo cuenta" : "Crear una cuenta nueva"; };
$("go").onclick = async () => {
  $("err").textContent = ""; const email = $("em").value.trim(), password = $("pw").value;
  const r = reg
    ? await db.auth.signUp({email, password, options:{data:{nombre:$("nm").value, apellidos:$("ap").value, telefono:$("te").value, direccion:$("di").value, grupo:$("gr").value}}})
    : await db.auth.signInWithPassword({email, password});
  if (r.error) return $("err").textContent = r.error.message;
  if (!r.data.session) return $("err").textContent = "Revisa tu correo para confirmar la cuenta.";
  enter(r.data.user);
};
async function enter(u) {
  me = u; const {data} = await db.from("profiles").select("*").eq("id", u.id).single(); perfil = data;
  const v = !!(perfil && perfil.validado);
  $("bn").classList.toggle("ok", v);
  $("bn").innerHTML = v ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg><div><b>Registro validado</b><span>Ya puedes enviar avisos</span></div>'
    : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>Registro pendiente de validar</b><span>Toca para comprobar</span></div>';
  show("home");
}
$("bn").onclick = () => enter(me);
(async () => { const {data:{session}} = await db.auth.getSession(); if (session) enter(session.user); })();


const TH=[{k:"",n:"Clásico azul",c:["#05254E","#D4DD2B","#F5F7FA"]},{k:"ebre",n:"Ebre (verde agua)",c:["#0B5D66","#F2A541","#EAF4F4"]},{k:"noche",n:"Noche",c:["#0F2A4D","#3DDCFF","#060B14"]},{k:"contraste",n:"Alto contraste",c:["#000","#FFE000","#fff"]},{k:"minimal",n:"Minimal",c:["#111","#FF6B5E","#fff"]}];
function setTheme(k){document.documentElement.dataset.t=k;try{localStorage.setItem("tema",k)}catch(e){}
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=(TH.find(t=>t.k==k)||TH[0]).c[0]}
try{setTheme(localStorage.getItem("tema")||"")}catch(e){}
function openThemes(){const cur=document.documentElement.dataset.t||"";
 sheet("<h1>Diseño</h1>"+TH.map(t=>`<button class="th" data-k="${t.k}" aria-pressed="${t.k==cur}"><span class="sw">${t.c.map(c=>`<u style="background:${c}"></u>`).join("")}</span>${t.n}</button>`).join(""));
 document.querySelectorAll(".th").forEach(b=>b.onclick=()=>{setTheme(b.dataset.k);openThemes()})}
$("dsg").onclick=openThemes;
const orb = $("orb"), ctr = $("ctr"), lbl = $("lbl");
nodes.forEach(n => {
  const b = document.createElement("button"); b.className = "nd"; b.style.background = n.bg; b.innerHTML = n.ic; b.setAttribute("aria-label", n.t);
  const r = n.a * Math.PI / 180; b.style.left = (50 + 40 * Math.sin(r)) + "%"; b.style.top = (50 - 40 * Math.cos(r)) + "%";
  let sx, sy, drag = false, was = false;
  const hit = () => { const o = orb.getBoundingClientRect(), q = b.getBoundingClientRect();
    return Math.hypot(q.left + q.width/2 - (o.left + o.width/2), q.top + q.height/2 - (o.top + o.height/2)) < o.width * .2; };
  b.onpointerdown = e => { drag = true; sx = e.clientX; sy = e.clientY; b.setPointerCapture(e.pointerId); b.style.transition = "none"; b.style.zIndex = 5; lbl.textContent = n.t; lbl.classList.add("on"); };
  b.onpointermove = e => { if (!drag) return; b.style.transform = `translate(calc(-50% + ${e.clientX-sx}px),calc(-50% + ${e.clientY-sy}px)) scale(1.12)`;
    const h = hit(); ctr.classList.toggle("hot", h); if (h && !was && navigator.vibrate) navigator.vibrate(25); was = h; };
  b.onpointerup = () => { if (!drag) return; drag = false; const h = hit(); was = false; ctr.classList.remove("hot"); b.style.zIndex = "";
    b.style.transition = "transform .25s"; b.style.transform = "translate(-50%,-50%)"; lbl.textContent = "Arrastra una bola al círculo central"; lbl.classList.remove("on"); if (h) send(n); };
  orb.appendChild(b);
});

async function send(n) {
  if (n.id == "not") return avisos();
  if (!perfil || !perfil.validado) return sheet("<h1>Registro pendiente</h1><p>Podrás enviar avisos cuando la Policía Local valide tu registro.</p>");
  navigator.geolocation.getCurrentPosition(p => post(n, p.coords.latitude, p.coords.longitude), () => post(n, null, null), {enableHighAccuracy:true, timeout:8000});
}
async function post(n, lat, lng) {
  const {error} = await db.from("alertas").insert({user_id: me.id, tipo: n.t, lat, lng});
  sheet(error ? `<h1>No se pudo enviar</h1><p>${esc(error.message)}</p><p><b>Si es urgente, llama al 112.</b></p>`
    : `<div class="ctr"><div class="okc"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1>Aviso enviado</h1><p><b>${esc(n.t)}</b></p><p>La Policía Local ha recibido tu aviso${lat ? " y tu ubicación" : " (sin ubicación: activa el GPS)"}.</p><p class="note">En una emergencia llama siempre al 112.</p></div>`);
  if (!error && navigator.vibrate) navigator.vibrate([60, 40, 60]);
}
async function avisos() {
  const {data} = await db.from("avisos").select("*").order("created_at", {ascending:false}).limit(20);
  sheet("<h1>Notificaciones</h1>" + ((data || []).map(a => `<div class="nt"><b>${esc(a.titulo)}</b><span>${esc(a.categoria)} · ${new Date(a.created_at).toLocaleString("es-ES")}</span></div>`).join("") || "<p>No hay avisos.</p>"));
}
$("inf").onclick = () => sheet("<h1>Secciones disponibles</h1><p>Arrastra la bola al círculo central para enviar el aviso.</p>" +
  nodes.map(n => `<div class="li"><div class="c" style="background:${n.bg}">${n.ic}</div><div><b>${esc(n.t)}</b><span class="note">${esc(n.d)}</span></div></div>`).join(""));
$("cfg").onclick = () => { sheet(`<h1>Configuración</h1><p><b>${esc(perfil?.nombre)} ${esc(perfil?.apellidos)}</b><br>${esc(me?.email)}</p><button class="btn o" id="dsg2" style="margin-top:14px">Cambiar diseño</button><button class="btn" id="out" style="margin-top:10px">Cerrar sesión</button>`);
  $("dsg2").onclick = openThemes;
  $("out").onclick = async () => { await db.auth.signOut(); $("ov").classList.remove("on"); show("auth"); }; };
</script>
</body>
</html>
