<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Policía Local Tortosa</title>
<style>
:root{--bg:#F2F3F7;--card:#fff;--ink:#05254E;--navy:#05254E;--red:#E0342B;--amb:#E8A33D;--ok:#2E9E5B}
@media (prefers-color-scheme:dark){:root{--bg:#060F1E;--card:#10213A;--ink:#E8EEFA;--navy:#1E4A8C}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
main{max-width:960px;margin:0 auto;padding:16px}
h2{margin:26px 0 10px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.card.nueva{border-left:8px solid var(--red)}.card.asignada{border-left:8px solid var(--amb)}.card.atendida{border-left:8px solid var(--ok);opacity:.65}
button,input{font:inherit}button{border:0;border-radius:8px;background:var(--navy);color:#fff;padding:10px 14px;cursor:pointer}
button.g{background:#0000;color:#fff;border:1px solid #fff8}button.r{background:var(--red)}button.a{background:var(--amb);color:#201400}button.k{background:var(--ok)}
input{padding:10px;border:1px solid #9994;border-radius:8px;background:var(--card);color:var(--ink)}
a{color:inherit}small{opacity:.75}#login{max-width:340px;margin:60px auto;display:grid;gap:10px}#err{color:var(--red)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:10px}
#snd{display:none;width:100%;background:var(--amb);color:#201400;font-weight:700;border-radius:12px;padding:14px;margin-bottom:10px}
#alarm{display:none;background:var(--red);color:#fff;font-weight:700;border-radius:12px;padding:14px;margin-bottom:10px;font-size:18px}
body.alarma header{animation:fl 1s steps(1) infinite}@keyframes fl{50%{background:var(--red)}}
</style>
</head>
<body>
<header><b>Policía Local de Tortosa · Panel</b><span><button class="g" id="mute">🔔 Sonido: sí</button> <button class="g" id="out" hidden>Salir</button></span></header>
<main>
<div id="login"><h2>Acceso de agentes</h2><input id="em" type="email" placeholder="Correo"><input id="pw" type="password" placeholder="Contraseña"><button id="go">Entrar</button><div id="err"></div></div>
<div id="panel" hidden>
<button id="snd">🔇 Toca aquí para activar el sonido de alarma</button>
<div id="alarm"></div>
<div class="bar"><b>Esta unidad:</b><input id="unit" placeholder="Ej. Comisaría, Patrulla 1" size="22"><small>Se guarda en este dispositivo. Los avisos que asignes aquí llevarán este nombre.</small></div>
<h2 style="margin-top:6px">Avisos recibidos</h2><div id="al"></div>
<h2>Registros pendientes de validar</h2><div id="pe"></div>
<h2>Publicar notificación</h2>
<div class="card"><input id="at" placeholder="Título del aviso" style="flex:1"><input id="ac" placeholder="Categoría" value="General"><button id="ap">Publicar</button></div>
<h2>Códigos de invitación</h2>
<div class="bar"><label>Usos <input id="cu" type="number" min="1" value="1" style="width:70px"></label><label>Días <input id="cd" type="number" min="1" value="7" style="width:70px"></label><input id="cn" placeholder="Nota (ej. Agentes turno noche)" size="26"><button id="gc">Generar código</button></div>
<div id="cl"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://gaaaxoccsewsqghiutrq.supabase.co";
const SUPABASE_KEY = "sb_publishable_HkxGy62A8XhCUr04YoPeGA_RBQY2xaF";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = i => document.getElementById(i);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const unidad = () => $("unit").value.trim() || "Sin nombre";
try { $("unit").value = localStorage.getItem("unidad") || "Comisaría"; } catch (e) { $("unit").value = "Comisaría"; }
$("unit").oninput = () => { try { localStorage.setItem("unidad", $("unit").value); } catch (e) {} };

/* ---- sonido de alarma, parpadeo y pantalla encendida ---- */
let ctx = null, muted = false, timer = null, tt = null, wl = null;
function unlock() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch (e) {}
  $("snd").style.display = (ctx && ctx.state === "running") ? "none" : "block"; }
document.addEventListener("click", unlock);
$("snd").onclick = unlock;
function beep() { if (!ctx || muted || ctx.state !== "running") return; const t = ctx.currentTime;
  [880, 660, 880, 660].forEach((f, i) => { const o = ctx.createOscillator(), g = ctx.createGain(), s = t + i * .25;
    o.type = "square"; o.frequency.value = f; g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(.35, s + .02); g.gain.exponentialRampToValueAtTime(.0001, s + .22);
    o.connect(g).connect(ctx.destination); o.start(s); o.stop(s + .24); }); }
function setAlarm(n) {
  document.body.classList.toggle("alarma", n > 0);
  $("alarm").style.display = n > 0 ? "block" : "none"; $("alarm").textContent = "🚨 " + n + (n == 1 ? " aviso sin atender" : " avisos sin atender");
  if (n > 0 && !timer) { beep(); timer = setInterval(beep, 4000); tt = setInterval(() => { document.title = document.title.startsWith("🚨") ? "Panel Policía Local" : "🚨 AVISO NUEVO"; }, 1000); }
  if (n == 0 && timer) { clearInterval(timer); clearInterval(tt); timer = tt = null; document.title = "Panel Policía Local Tortosa"; }
}
$("mute").onclick = () => { muted = !muted; $("mute").textContent = muted ? "🔕 Sonido: no" : "🔔 Sonido: sí"; };
async function lock() { try { wl = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !$("panel").hidden) lock(); });

/* ---- acceso ---- */
$("go").onclick = async () => { unlock();
  const {error} = await db.auth.signInWithPassword({email:$("em").value.trim(), password:$("pw").value});
  if (error) return $("err").textContent = error.message; start(); };
$("out").onclick = async () => { await db.auth.signOut(); location.reload(); };
async function start() {
  const {data:{user}} = await db.auth.getUser(); if (!user) return;
  const {data:p} = await db.from("profiles").select("rol").eq("id", user.id).single();
  if (!p || p.rol !== "agente") { await db.auth.signOut(); return $("err").textContent = "Esta cuenta no es de agente."; }
  $("login").hidden = true; $("panel").hidden = false; $("out").hidden = false; unlock(); lock(); load();
  db.channel("rt").on("postgres_changes", {event:"*", schema:"public", table:"alertas"}, load)
    .on("postgres_changes", {event:"*", schema:"public", table:"profiles"}, load).subscribe();
}

/* ---- datos ---- */
async function load() { cargaCodigos();
  const a = await db.from("alertas").select("*, profiles(nombre,apellidos,telefono,direccion,grupo,matricula,aseguradora)").order("created_at", {ascending:false}).limit(50);
  const lista = a.data || [];
  setAlarm(lista.filter(x => x.estado == "nueva").length);
  $("al").innerHTML = lista.map(x => { const p = x.profiles || {};
    const map = x.lat ? `<a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${x.lat}&mlon=${x.lng}#map=18/${x.lat}/${x.lng}">Ver ubicación</a>` : "<small>Sin ubicación</small>";
    const mat = p.matricula ? `<br><b>Matrícula: ${esc(p.matricula)}</b> <small>(declarada, sin verificar)${p.aseguradora ? " · Aseguradora: " + esc(p.aseguradora) : ""}</small>` : "";
    const asig = x.patrulla ? `<br><b>→ ${esc(x.patrulla)}</b>` : "";
    const btns = x.estado == "nueva" ? `<button class="r" data-m="${x.id}">Voy yo (${esc(unidad())})</button> <button class="a" data-o="${x.id}">Asignar a…</button> ` : "";
    const fin = x.estado != "atendida" ? `<button class="k" data-a="${x.id}">Atendida</button>` : "";
    return `<div class="card ${esc(x.estado)}"><div><b>${esc(x.tipo)}</b> <small>${new Date(x.created_at).toLocaleString("es-ES")}</small><br>${esc(p.nombre)} ${esc(p.apellidos)} · ${esc(p.telefono)} · ${esc(p.grupo)}<br><small>${esc(p.direccion)}</small>${mat}${asig}</div><div>${map} ${btns}${fin}</div></div>`; }).join("") || "<p>Sin avisos.</p>";
  const v = await db.from("profiles").select("id,nombre,apellidos,telefono,direccion").eq("validado", false).eq("rol", "ciudadano");
  $("pe").innerHTML = (v.data || []).map(u => `<div class="card"><div><b>${esc(u.nombre)} ${esc(u.apellidos)}</b><br><small>${esc(u.telefono)} · ${esc(u.direccion)}</small></div><button data-v="${u.id}">Validar</button></div>`).join("") || "<p>Ninguno.</p>";
}
async function upd(id, campos, soloNueva) { let q = db.from("alertas").update(campos).eq("id", id); if (soloNueva) q = q.eq("estado", "nueva");
  const {error} = await q; if (error) alert("No se pudo guardar: " + error.message + "\n(¿Has ejecutado el SQL de patrullas?)"); load(); }
document.addEventListener("click", async e => { const d = e.target.dataset;
  if (d.m) upd(d.m, {estado:"asignada", patrulla:unidad()}, true);
  if (d.o) { const n = prompt("¿A qué unidad lo asignas? (Ej. Patrulla 2)"); if (n && n.trim()) upd(d.o, {estado:"asignada", patrulla:n.trim()}, true); }
  if (d.a) upd(d.a, {estado:"atendida"}, false);
  if (d.cp) copia(d.cp);
  if (d.x) { await db.from("codigos").update({activo:false}).eq("codigo", d.x); cargaCodigos(); }
  if (d.v) { await db.rpc("validar_usuario", {uid:d.v}); load(); } });
$("ap").onclick = async () => { if (!$("at").value.trim()) return;
  const {error} = await db.from("avisos").insert({titulo:$("at").value.trim(), categoria:$("ac").value.trim() || "General"});
  if (!error) $("at").value = ""; else alert(error.message); };
const fmt = c => c.length == 8 ? c.slice(0, 4) + "-" + c.slice(4) : c;
const enlace = c => location.href.replace(/panel\.html.*$/, "") + "?codigo=" + c;
async function copia(c) { const t = enlace(c); try { await navigator.clipboard.writeText(t); alert("Enlace copiado:\n" + t); } catch (e) { prompt("Copia este enlace:", t); } }
async function cargaCodigos() {
  const r = await db.from("codigos").select("*").order("created_at", {ascending:false}).limit(30);
  $("cl").innerHTML = (r.data || []).map(c => { const vivo = c.activo && c.usos < c.usos_max && (!c.caduca || new Date(c.caduca) > new Date());
    return `<div class="card"><div><b>${esc(fmt(c.codigo))}</b> <small>${vivo ? "(activo)" : "(no válido)"}</small><br><small>Usos ${c.usos}/${c.usos_max} · caduca ${c.caduca ? new Date(c.caduca).toLocaleDateString("es-ES") : "nunca"}${c.nota ? " · " + esc(c.nota) : ""}</small></div><div>${vivo ? `<button data-cp="${esc(c.codigo)}">Copiar enlace</button> <button class="r" data-x="${esc(c.codigo)}">Desactivar</button>` : ""}</div></div>`; }).join("") || "<p>Aún no hay códigos.</p>";
}
$("gc").onclick = async () => {
  const {data, error} = await db.rpc("crear_codigo", {p_usos: +$("cu").value || 1, p_dias: +$("cd").value || 7, p_nota: $("cn").value.trim() || null});
  if (error) return alert(error.message + "\n(¿Has ejecutado el SQL de códigos?)");
  $("cn").value = ""; cargaCodigos(); copia(data); };
db.auth.getSession().then(({data}) => { if (data.session) start(); });
</script>
</body>
</html>
